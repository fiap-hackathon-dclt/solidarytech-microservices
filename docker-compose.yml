name: solidarytech

x-aws-local: &aws-local
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local

services:
  postgres:
    image: postgres:16.16-alpine3.24
    environment:
      POSTGRES_USER: solidary
      POSTGRES_PASSWORD: solidary
    volumes:
      - ./local/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./ngo-service/db/init.sql:/sql/ngo.sql:ro
      - ./donation-service/db/init.sql:/sql/donation.sql:ro
    healthcheck:
      # Por TCP: durante o init o Postgres só escuta no socket local e o pg_isready sem -h já responde pronto.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "solidary"]
      interval: 2s
      retries: 30

  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1
    volumes:
      - ./local/elasticmq.conf:/opt/elasticmq.conf:ro

  dynamodb:
    image: amazon/dynamodb-local:3.3.2
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]

  dynamodb-init:
    image: amazon/aws-cli:2.42.3
    environment: *aws-local
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws dynamodb list-tables --endpoint-url http://dynamodb:8000 >/dev/null 2>&1; do sleep 1; done
        aws dynamodb describe-table --table-name SolidaryTechVolunteers --endpoint-url http://dynamodb:8000 >/dev/null 2>&1 ||
        aws dynamodb create-table --endpoint-url http://dynamodb:8000 \
          --table-name SolidaryTechVolunteers \
          --attribute-definitions AttributeName=volunteer_id,AttributeType=S \
          --key-schema AttributeName=volunteer_id,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST >/dev/null
    depends_on:
      - dynamodb

  ngo-service:
    build: ./ngo-service
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://solidary:solidary@postgres:5432/ngo_db
    depends_on:
      postgres:
        condition: service_healthy

  donation-service:
    build: ./donation-service
    ports:
      - "8082:8082"
    environment:
      <<: *aws-local
      DATABASE_URL: postgres://solidary:solidary@postgres:5432/donation_db
      AWS_SQS_URL: http://elasticmq:9324/000000000000/solidary-donations
      AWS_ENDPOINT_URL_SQS: http://elasticmq:9324
    depends_on:
      postgres:
        condition: service_healthy
      elasticmq:
        condition: service_started

  volunteer-service:
    build: ./volunteer-service
    ports:
      - "8083:8083"
    environment:
      <<: *aws-local
      AWS_DYNAMODB_TABLE: SolidaryTechVolunteers
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb:8000
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully
